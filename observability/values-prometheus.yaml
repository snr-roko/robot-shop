fullnameOverride: kube-prometheus-stack

prometheus:
  prometheusSpec:
    retention: 6h
    scrapeInterval: 30s
    evaluationInterval: 30s
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1200Mi

alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-slack
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: slack
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: muted
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor"
    receivers:
      - name: muted
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
            send_resolved: true
            title: '{{ if eq .Status "firing" }}[FIRING]{{ else }}[RESOLVED]{{ end }} {{ .CommonLabels.alertname }}'
            text: |-
              {{ range .Alerts -}}
              *{{ .Labels.severity }}* / {{ .Labels.slo }} budget
              {{ .Annotations.summary }}
              {{ .Annotations.description }}
              Runbook: {{ .Annotations.runbook_url }}
              {{ end }}

grafana:
  admin:
    existingSecret: grafana-admin
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  persistence:
    enabled: false
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
