apiVersion: v1
data:
  robot-shop.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "type": "stat",
          "title": "Probe success (5m)",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 0.99 },
                  { "color": "green", "value": 0.995 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "expr": "avg_over_time(probe_success{job=\"robot-shop-web\"}[5m])"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Availability budget consumed (1h)",
          "description": "Percentage of the 1% monthly availability budget spent in the last hour",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 50 },
                  { "color": "red", "value": 100 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "expr": "clamp_min((1 - avg_over_time(probe_success{job=\"robot-shop-web\"}[1h])) / 0.01 * 100, 0)"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Pods ready",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 0.9 },
                  { "color": "green", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "expr": "sum(kube_pod_status_ready{namespace=\"robot-shop\",condition=\"true\"}) / count(kube_pod_status_ready{namespace=\"robot-shop\",condition=\"true\"})"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Probe p95 latency (5m)",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.3 },
                  { "color": "red", "value": 0.5 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "auto",
            "textMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "instant": true,
              "expr": "quantile_over_time(0.95, probe_duration_seconds{job=\"robot-shop-web\"}[5m])"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Probe success ratio vs 99% SLO",
          "description": "Blackbox probe against the web Service, 15s interval",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false,
                "lineInterpolation": "smooth"
              }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "SLO 99%" },
                "properties": [
                  { "id": "custom.lineStyle", "value": { "dash": [10, 10], "fill": "dash" } },
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }
                ]
              }
            ]
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "calcs": [] },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "probe success (5m)",
              "expr": "avg_over_time(probe_success{job=\"robot-shop-web\"}[5m])"
            },
            {
              "refId": "B",
              "legendFormat": "SLO 99%",
              "expr": "vector(0.99)"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Probe latency",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "calcs": [] },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "p50",
              "expr": "quantile_over_time(0.5, probe_duration_seconds{job=\"robot-shop-web\"}[5m])"
            },
            {
              "refId": "B",
              "legendFormat": "p95",
              "expr": "quantile_over_time(0.95, probe_duration_seconds{job=\"robot-shop-web\"}[5m])"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "CPU by container",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 13 },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["lastNotNull"] },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{container}}",
              "expr": "sum by (container) (rate(container_cpu_usage_seconds_total{namespace=\"robot-shop\",container!=\"\",container!=\"POD\"}[5m]))"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Memory working set by container",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 13 },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["lastNotNull"] },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{container}}",
              "expr": "sum by (container) (container_memory_working_set_bytes{namespace=\"robot-shop\",container!=\"\",container!=\"POD\"})"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Container restarts (15m increase)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 21 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "drawStyle": "bars",
                "lineWidth": 1,
                "fillOpacity": 60,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "calcs": [] },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "{{pod}}",
              "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"robot-shop\"}[15m])) > 0"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Pods not ready",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 21 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 20,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "calcs": [] },
            "tooltip": { "mode": "single", "sort": "none" }
          },
          "targets": [
            {
              "refId": "A",
              "legendFormat": "not ready",
              "expr": "sum(kube_pod_status_ready{namespace=\"robot-shop\",condition=\"true\"} == 0)"
            }
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["robot-shop", "slo", "capstone"],
      "templating": { "list": [] },
      "time": { "from": "now-3h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Robot Shop - Storefront SLO",
      "uid": "robot-shop-slo",
      "version": 1
    }
kind: ConfigMap
metadata:
  name: robot-shop-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
